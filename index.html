<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cartellino di Lavorazione</title>
<meta name="theme-color" content="#0b0d12">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

  /* RESET & VARIABLES - Modern Dark Theme (Ergonomico per Smartphone) */
  :root {
    --bg-main: #0c0e12;
    --bg-card: #14171f;
    --bg-input: #1b1f2b;
    --bg-input-focus: #232838;
    --border-color: #272c3d;
    --border-hover: #3b4259;
    --accent-primary: #10b981;
    --accent-glow: rgba(16, 185, 129, 0.15);
    --accent-blue: #3b82f6;
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-main);
    background-image: 
      radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.05) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.05) 0px, transparent 50%);
    background-attachment: fixed;
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 70px;
    padding-bottom: 130px;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* BARRA SUPERIORE */
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: rgba(12, 14, 18, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  
  .top-bar-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* CONTAINER PRINCIPALE */
  .sheet-container {
    width: 95%;
    max-width: 1100px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* SCHEDE SEZIONE */
  .section-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    transition: border-color 0.2s ease;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-color);
  }

  .section-header h2 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-primary);
  }

  /* GRIGLIA INPUT */
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }

  /* CAMPI DI INPUT (16px font previene auto-zoom su iOS) */
  .field-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  input, select, textarea {
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    color: var(--text-main);
    font-family: inherit;
    font-size: 16px;
    padding: 12px 14px;
    width: 100%;
    box-sizing: border-box;
    transition: all 0.2s ease;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    background: var(--bg-input-focus);
    border-color: var(--accent-primary);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  /* CARD OPERAZIONE */
  .card-op {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 20px;
    position: relative;
    box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.4);
    transition: border-color 0.2s ease;
  }

  .card-op::before {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 4px;
    background: var(--accent-primary);
    border-top-left-radius: var(--radius-lg);
    border-bottom-left-radius: var(--radius-lg);
  }

  .op-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .op-badge {
    background: var(--accent-glow);
    color: var(--accent-primary);
    border: 1px solid rgba(16, 185, 129, 0.3);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  /* TOOLBAR DI COMANDO PER CARD */
  .action-bar {
    display: flex;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    overflow: hidden;
  }

  .action-bar button {
    background: transparent;
    color: var(--text-muted);
    border: none;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    border-right: 1px solid var(--border-color);
    transition: all 0.15s ease;
  }

  .action-bar button:last-child { border-right: none; }
  .action-bar button:hover { background: var(--bg-input-focus); color: var(--text-main); }
  .action-bar button.btn-danger:hover { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }

  /* FASI DI LAVORAZIONE CONTAINER */
  .fasi-wrapper {
    background: rgba(12, 14, 18, 0.6);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 14px;
    margin-top: 16px;
  }

  .fase-row {
    display: grid;
    grid-template-columns: 70px minmax(180px, 2fr) repeat(5, minmax(70px, 1fr)) auto;
    gap: 10px;
    align-items: end;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    padding: 12px;
    margin-bottom: 10px;
  }

  /* BOTTONI PRINCIPALI */
  button.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 18px;
    border-radius: var(--radius-md);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
  }

  .btn-add-op {
    background: rgba(16, 185, 129, 0.1);
    color: var(--accent-primary);
    border: 1px dashed var(--accent-primary) !important;
    width: 100%;
    padding: 16px;
    font-size: 13px;
    border-radius: var(--radius-lg);
  }
  .btn-add-op:hover { background: rgba(16, 185, 129, 0.2); }

  .btn-add-fase {
    background: rgba(59, 130, 246, 0.1);
    color: var(--accent-blue);
    border: 1px dashed var(--accent-blue) !important;
    width: 100%;
    margin-top: 10px;
    padding: 10px;
  }
  .btn-add-fase:hover { background: rgba(59, 130, 246, 0.2); }

  /* BOTTOM DOCK (Mobile Bottom Bar) */
  .bottom-dock {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(12, 14, 18, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border-color);
    padding: 12px 16px;
    z-index: 1000;
    display: flex;
    justify-content: center;
  }

  .dock-content {
    width: 100%;
    max-width: 1100px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn-pdf { background: var(--accent-blue); color: #fff; flex: 2; min-width: 140px; }
  .btn-pdf:hover { background: #2563eb; }

  .btn-save { background: var(--accent-primary); color: #000; flex: 1; min-width: 110px; }
  .btn-save:hover { background: #059669; color: #fff; }

  .btn-load { background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-color) !important; flex: 1; min-width: 110px; }
  .btn-load:hover { background: var(--bg-input-focus); }

  .btn-reset { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3) !important; }
  .btn-reset:hover { background: var(--accent-red); color: #fff; }

  /* MEDIA QUERY SMARTPHONE (Layout trasformato in card per schermi piccoli) */
  @media screen and (max-width: 900px) {
    body { padding-top: 65px; padding-bottom: 150px; }
    .sheet-container { width: 98%; }
    
    .fase-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px;
    }
    
    .fase-row > div { width: 100%; }
    
    .fase-row .action-bar {
      width: 100%;
      margin-top: 4px;
    }
    
    .fase-row .action-bar button {
      flex: 1;
      padding: 12px 0;
      text-align: center;
    }
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-title">⚙️ Cartellino di Lavorazione</div>
</div>

<div class="sheet-container" id="main-form">
    
    <!-- DATI STUDENTE -->
    <div class="section-card">
      <div class="section-header">
        <h2>Dati Studente</h2>
      </div>
      <div class="grid-3">
        <div class="field-group"><label>Allievo</label><input type="text" id="stdName" placeholder="Nome e Cognome"></div>
        <div class="field-group"><label>Classe</label><input type="text" id="stdClass" placeholder="Es. 3A MAT"></div>
        <div class="field-group"><label>A.S.</label><input type="text" id="stdAS" value="2025/26"></div>
        <div class="field-group"><label>Data Consegna</label><input type="date" id="stdDate"></div>
      </div>
    </div>

    <!-- ELEMENTO FINITO -->
    <div class="section-card">
      <div class="section-header">
        <h2>Dati Elemento Finito</h2>
      </div>
      <div class="grid-3">
        <div class="field-group"><label>Denominazione / Particolare</label><input type="text" id="finName" placeholder="Es. Perno flangiato"></div>
        <div class="field-group"><label>Disegno N°</label><input type="text" id="finDraw"></div>
        <div class="field-group"><label>Trattamenti</label><input type="text" id="finTreat"></div>
        <div class="field-group"><label>Peso Finito [kg]</label><input type="number" id="finWeight" inputmode="decimal"></div>
      </div>
    </div>

    <!-- SEMILAVORATO -->
    <div class="section-card">
      <div class="section-header">
        <h2>Dati Semilavorato</h2>
      </div>
      <div class="grid-3">
        <div class="field-group"><label>Materiale</label><input type="text" id="matName" placeholder="Es. C45 / Fe510"></div>
        <div class="field-group"><label>Ricavato da</label><input type="text" id="matRaw" placeholder="Es. Tondo Ø40x100"></div>
        <div class="field-group"><label>Rm [N/mm²]</label><input type="number" id="matRm" inputmode="numeric"></div>
        <div class="field-group"><label>HBW</label><input type="number" id="matHBW" inputmode="numeric"></div>
        <div class="field-group"><label>Peso Grezzo [kg]</label><input type="number" id="matMass" inputmode="decimal"></div>
        <div class="field-group"><label>Quantità</label><input type="number" id="matQty" value="1" inputmode="numeric"></div>
      </div>
    </div>

    <!-- OPERAZIONI E FASI -->
    <div class="section-header" style="margin-top: 10px;">
      <h2>Operazioni e Fasi di Lavorazione</h2>
    </div>
    
    <div id="operazioni-list"></div>

    <button class="btn btn-add-op" onclick="aggiungiOperazione()">+ Aggiungi Nuova Operazione</button>
</div>

<input type="file" id="fileLoader" style="display:none;" accept=".json" onchange="gestisciCaricamentoFile(event)">

<!-- BARRA DOCK INFERIORE -->
<div class="bottom-dock">
  <div class="dock-content">
    <button class="btn btn-save" onclick="salvaSuFile()">SCARICA BOZZA</button>
    <button class="btn btn-load" onclick="document.getElementById('fileLoader').click()">CARICA BOZZA</button>
    <button class="btn btn-pdf" onclick="generaPDF()">STAMPA PDF</button>
    <button class="btn btn-reset" id="btnReset" onclick="resetDati()">RESET</button>
  </div>
</div>

<script>
    window.onload = function() {
        if(localStorage.getItem('cartellino_bozza')) eseguiCaricamentoNascosto();
        else aggiungiOperazione();
        setInterval(salvaInMemoria, 2000);
    };

    function generaIdUnivoco() { return Math.random().toString(36).substr(2, 9); }

    function aggiungiOperazione(opData = null) {
        const opId = generaIdUnivoco();
        const cardsCount = document.querySelectorAll('.card-op').length + 1;
        
        const defaultNum = (opData && opData.num) ? opData.num : (cardsCount * 10);
        let savedMacName = opData ? (opData.macName || opData.mac || '') : '';
        if (opData && opData.macDesc) {
            savedMacName += savedMacName ? ` (${opData.macDesc})` : opData.macDesc;
        }
        
        const savedTools = opData ? (opData.tools || '') : '';
        
        const html = `
            <div class="card-op" id="operazione-${opId}">
                <div class="op-top-bar">
                    <span class="op-badge">OPERAZIONE</span>
                    <div class="action-bar">
                        <button title="Sposta Su" onclick="spostaOperazione(this, -1)">▲</button>
                        <button title="Sposta Giù" onclick="spostaOperazione(this, 1)">▼</button>
                        <button title="Duplica" onclick="duplicaOperazione('${opId}')">📋</button>
                        <button class="btn-danger" title="Rimuovi" onclick="rimuoviOperazione('${opId}')">✕</button>
                    </div>
                </div>
                <div class="grid-2" style="margin-bottom: 14px;">
                    <div class="field-group" style="max-width: 120px;">
                        <label>Num Op.</label>
                        <input type="text" class="op-num" value="${defaultNum}" inputmode="numeric" style="font-weight:700; color:var(--accent-primary);" onchange="rinumeraFasiContainer('${opId}')">
                    </div>
                    <div class="field-group">
                        <label>Macchina / Postazione</label>
                        <input type="text" class="op-mac-name" placeholder="Es. Tornio Parallelo CNC" value="${savedMacName}">
                    </div>
                </div>
                <div class="field-group">
                    <label>Utensili, Attrezzi e Calibri</label>
                    <textarea class="op-tools" rows="2" placeholder="Elenco attrezzatura...">${savedTools}</textarea>
                </div>
                <div class="fasi-wrapper">
                    <label style="color:var(--accent-blue); margin-bottom:10px; font-size:11px; display:block;">FASI DI LAVORAZIONE</label>
                    <div id="fasi-${opId}"></div>
                    <button class="btn btn-add-fase" onclick="aggiungiFase('${opId}')">+ AGGIUNGI FASE</button>
                </div>
            </div>
        `;
        document.getElementById('operazioni-list').insertAdjacentHTML('beforeend', html);
        
        if (opData && opData.fasi && Array.isArray(opData.fasi) && opData.fasi.length > 0) { 
            opData.fasi.forEach(fData => aggiungiFase(opId, fData)); 
        } else { 
            aggiungiFase(opId); 
        }
    }

    function duplicaOperazione(opId) {
        const opCard = document.getElementById(`operazione-${opId}`);
        const opData = {
            num: opCard.querySelector('.op-num').value, 
            macName: opCard.querySelector('.op-mac-name').value,
            tools: opCard.querySelector('.op-tools').value,
            fasi: Array.from(opCard.querySelectorAll('.fase-row')).map(fase => ({
                num: fase.querySelector('.fase-num').value, desc: fase.querySelector('.fase-desc').value,
                vt: fase.querySelector('.fase-vt').value, n: fase.querySelector('.fase-n').value,
                f: fase.querySelector('.fase-f').value, p: fase.querySelector('.fase-p').value, tc: fase.querySelector('.fase-tc').value
            }))
        };
        aggiungiOperazione(opData); rinumeraTutteOperazioni();
    }

    function rimuoviOperazione(opId) { document.getElementById(`operazione-${opId}`).remove(); rinumeraTutteOperazioni(); }
    
    function spostaOperazione(btn, dir) {
        const card = btn.closest('.card-op'); const list = document.getElementById('operazioni-list');
        if (dir === -1 && card.previousElementSibling) list.insertBefore(card, card.previousElementSibling);
        else if (dir === 1 && card.nextElementSibling) list.insertBefore(card.nextElementSibling, card);
        rinumeraTutteOperazioni();
    }

    function rinumeraTutteOperazioni() {
        document.querySelectorAll('.card-op').forEach((op, index) => {
            op.querySelector('.op-num').value = (index + 1) * 10; rinumeraFasiContainer(op.id.replace('operazione-', ''));
        });
    }

    function aggiungiFase(opId, fData = null) {
        const c = document.getElementById(`fasi-${opId}`); 
        const opCard = document.getElementById(`operazione-${opId}`);
        const opNum = opCard.querySelector('.op-num').value; 
        const fNum = (fData && fData.num) ? fData.num : `${opNum}.${c.querySelectorAll('.fase-row').length + 1}`;

        const html = `
            <div class="fase-row">
                <div class="field-group"><label>N°</label><input type="text" class="fase-num" value="${fNum}" readonly style="background:var(--bg-main); color:var(--text-muted); font-size:13px;"></div>
                <div class="field-group"><label>Descrizione Fase</label><input type="text" class="fase-desc" value="${fData ? (fData.desc || '') : ''}"></div>
                <div class="field-group"><label>Vt [m/min]</label><input type="number" class="fase-vt" value="${fData ? (fData.vt || '') : ''}" inputmode="decimal"></div>
                <div class="field-group"><label>n [rpm]</label><input type="number" class="fase-n" value="${fData ? (fData.n || '') : ''}" inputmode="decimal"></div>
                <div class="field-group"><label>f [mm/g]</label><input type="text" class="fase-f" value="${fData ? (fData.f || '') : ''}" inputmode="decimal"></div>
                <div class="field-group"><label>ap [mm]</label><input type="number" class="fase-p" value="${fData ? (fData.p || '') : ''}" inputmode="decimal"></div>
                <div class="field-group"><label>tc [min]</label><input type="number" class="fase-tc" value="${fData ? (fData.tc || '') : ''}" inputmode="decimal"></div>
                <div class="field-group"><div class="action-bar"><button title="Su" onclick="spostaFase(this, -1)">▲</button><button title="Giù" onclick="spostaFase(this, 1)">▼</button><button title="Copia" onclick="duplicaFase(this, '${opId}')">📋</button><button class="btn-danger" title="Elimina" onclick="rimuoviFase(this, '${opId}')">✕</button></div></div>
            </div>
        `;
        c.insertAdjacentHTML('beforeend', html);
    }

    function duplicaFase(btn, opId) {
        const row = btn.closest('.fase-row');
        aggiungiFase(opId, {
            num: "", desc: row.querySelector('.fase-desc').value, vt: row.querySelector('.fase-vt').value,
            n: row.querySelector('.fase-n').value, f: row.querySelector('.fase-f').value,
            p: row.querySelector('.fase-p').value, tc: row.querySelector('.fase-tc').value
        });
        rinumeraFasiContainer(opId);
    }

    function rimuoviFase(btn, opId) { btn.closest('.fase-row').remove(); rinumeraFasiContainer(opId); }

    function spostaFase(btn, dir) {
        const row = btn.closest('.fase-row'); const c = row.parentElement;
        if (dir === -1 && row.previousElementSibling?.classList.contains('fase-row')) c.insertBefore(row, row.previousElementSibling);
        else if (dir === 1 && row.nextElementSibling?.classList.contains('fase-row')) c.insertBefore(row.nextElementSibling, row);
        rinumeraFasiContainer(c.id.replace('fasi-', ''));
    }

    function rinumeraFasiContainer(opId) {
        const opCard = document.getElementById(`operazione-${opId}`); if (!opCard) return;
        const opNum = opCard.querySelector('.op-num').value;
        opCard.querySelectorAll('.fase-row').forEach((fase, idx) => fase.querySelector('.fase-num').value = `${opNum}.${idx + 1}`);
    }

    let resetTimer = null;

    function resetDati() {
        const btn = document.getElementById('btnReset');
        
        if (btn.innerText === "RESET") {
            btn.innerText = "CONFERMA?";
            btn.style.backgroundColor = "var(--accent-red)";
            btn.style.color = "#fff";
            
            resetTimer = setTimeout(() => {
                btn.innerText = "RESET";
                btn.style.backgroundColor = "rgba(239, 68, 68, 0.15)";
                btn.style.color = "var(--accent-red)";
            }, 3000);
            
        } else {
            clearTimeout(resetTimer);
            btn.innerText = "RESET";
            btn.style.backgroundColor = "rgba(239, 68, 68, 0.15)";
            btn.style.color = "var(--accent-red)";
            
            localStorage.removeItem('cartellino_bozza'); 
            document.querySelectorAll('.sheet-container input').forEach(inp => inp.value = '');
            document.getElementById('stdAS').value = '2025/26'; 
            document.getElementById('matQty').value = '1';
            document.getElementById('operazioni-list').innerHTML = '';
            aggiungiOperazione(); 
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function ottieniDatiAttuali() {
        const getVal = id => { const el = document.getElementById(id); return el ? el.value : ""; };
        return {
            stdName: getVal('stdName'), stdClass: getVal('stdClass'), stdAS: getVal('stdAS'), stdDate: getVal('stdDate'),
            finName: getVal('finName'), finDraw: getVal('finDraw'), finTreat: getVal('finTreat'), finWeight: getVal('finWeight'),
            matName: getVal('matName'), matRaw: getVal('matRaw'), matQty: getVal('matQty'),
            matRm: getVal('matRm'), matMass: getVal('matMass'), matHBW: getVal('matHBW'),
            operazioni: Array.from(document.querySelectorAll('.card-op')).map(op => ({
                num: op.querySelector('.op-num') ? op.querySelector('.op-num').value : "", 
                macName: op.querySelector('.op-mac-name') ? op.querySelector('.op-mac-name').value : "", 
                tools: op.querySelector('.op-tools') ? op.querySelector('.op-tools').value : "",
                fasi: Array.from(op.querySelectorAll('.fase-row')).map(fase => ({
                    num: fase.querySelector('.fase-num') ? fase.querySelector('.fase-num').value : "", 
                    desc: fase.querySelector('.fase-desc') ? fase.querySelector('.fase-desc').value : "", 
                    vt: fase.querySelector('.fase-vt') ? fase.querySelector('.fase-vt').value : "",
                    n: fase.querySelector('.fase-n') ? fase.querySelector('.fase-n').value : "", 
                    f: fase.querySelector('.fase-f') ? fase.querySelector('.fase-f').value : "", 
                    p: fase.querySelector('.fase-p') ? fase.querySelector('.fase-p').value : "", 
                    tc: fase.querySelector('.fase-tc') ? fase.querySelector('.fase-tc').value : ""
                }))
            }))
        };
    }

    function salvaInMemoria() { try { localStorage.setItem('cartellino_bozza', JSON.stringify(ottieniDatiAttuali())); } catch(e) {} }

    function eseguiCaricamentoNascosto() {
        try { 
            const savedData = localStorage.getItem('cartellino_bozza');
            if(savedData) popolaCampi(JSON.parse(savedData)); 
        } catch (err) {}
    }

    function salvaSuFile() {
        const dataStr = JSON.stringify(ottieniDatiAttuali(), null, 2);
        const blob = new Blob([dataStr], { type: "application/json" }); const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url;
        let nome = document.getElementById('stdName').value.trim() || "Studente";
        let pezzo = document.getElementById('finName').value.trim() || "Pezzo";
        a.download = `${nome}_${pezzo}.json`.replace(/\s+/g, "_");
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    function gestisciCaricamentoFile(event) {
        const file = event.target.files[0]; 
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(e) { 
            try { 
                const jsonData = JSON.parse(e.target.result);
                popolaCampi(jsonData); 
                alert("Dati caricati correttamente dal file!");
            } catch (err) { 
                alert("Si è verificato un errore nella lettura del file."); 
            } finally { 
                event.target.value = ""; 
            } 
        };
        reader.readAsText(file, "UTF-8");
    }

    function popolaCampi(data) {
        if(!data) return;
        const setV = (id, val) => { const el = document.getElementById(id); if(el) el.value = val || ""; };

        setV('stdName', data.stdName); setV('stdClass', data.stdClass);
        setV('stdAS', data.stdAS || "2025/26"); setV('stdDate', data.stdDate);
        setV('finName', data.finName); setV('finDraw', data.finDraw);
        setV('finTreat', data.finTreat); setV('finWeight', data.finWeight);
        setV('matName', data.matName); setV('matRaw', data.matRaw);
        setV('matQty', data.matQty || "1"); setV('matRm', data.matRm);
        setV('matMass', data.matMass); setV('matHBW', data.matHBW);
        
        document.getElementById('operazioni-list').innerHTML = "";
        if (data.operazioni && Array.isArray(data.operazioni) && data.operazioni.length > 0) {
            data.operazioni.forEach(op => aggiungiOperazione(op));
        } else {
            aggiungiOperazione();
        }
    }

    async function generaPDF() {
        if(!window.jspdf) { alert("Attendi caricamento librerie..."); return; }
        const { jsPDF } = window.jspdf; const doc = new jsPDF('p', 'mm', 'a4'); 
        const getVal = id => document.getElementById(id).value;
        
        doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text("CICLO DI LAVORAZIONE", 105, 14, {align: "center"});
        
        const topY = 22; const colW = 190 / 4; doc.setLineWidth(0.3); doc.setFontSize(10);
        doc.rect(10, topY, 190, 8); doc.line(10+colW, topY, 10+colW, topY+16); doc.line(10+colW*2, topY, 10+colW*2, topY+16); doc.line(10+colW*3, topY, 10+colW*3, topY+16);
        doc.setFontSize(8); doc.text("STUDENTE", 11, topY+3); doc.text("CLASSE", 11+colW, topY+3); doc.text("A.S.", 11+colW*2, topY+3); doc.text("DATA CONSEGNA", 11+colW*3, topY+3);
        doc.setFontSize(10); doc.setFont("helvetica", "normal"); doc.rect(10, topY+8, 190, 8); 
        doc.text(getVal('stdName'), 11, topY+14); doc.text(getVal('stdClass'), 11+colW, topY+14); doc.text(getVal('stdAS'), 11+colW*2, topY+14); doc.text(getVal('stdDate'), 11+colW*3, topY+14);

        const matY = topY + 22;
        doc.rect(10, matY, 95, 26); doc.setFontSize(8); doc.setFont("helvetica", "bold"); doc.text("CARATTERISTICHE ELEMENTO FINITO", 12, matY + 4); doc.line(10, matY+6, 105, matY+6);
        doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.text(`Denominazione: ${getVal('finName')}`, 12, matY + 11); doc.text(`Disegno N°: ${getVal('finDraw')}`, 12, matY + 16); doc.text(`Peso Finito [kg]: ${getVal('finWeight')}`, 12, matY + 21); doc.text(`Trattamenti: ${getVal('finTreat')}`, 60, matY + 21);

        doc.rect(105, matY, 95, 26); doc.setFontSize(8); doc.setFont("helvetica", "bold"); doc.text("CARATTERISTICHE MATERIALE E SEMILAVORATO", 107, matY + 4); doc.line(105, matY+6, 200, matY+6);
        doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.text(`Materiale: ${getVal('matName')}`, 107, matY + 11); doc.text(`Rm [N/mm2]: ${getVal('matRm')}`, 160, matY + 11); doc.text(`Ricavato da: ${getVal('matRaw')}`, 107, matY + 16); doc.text(`HBW: ${getVal('matHBW')}`, 160, matY + 16); doc.text(`Peso Grezzo [kg]: ${getVal('matMass')}`, 107, matY + 21); doc.text(`Quantità: ${getVal('matQty')}`, 160, matY + 21);

        const tableBody = [];
        document.querySelectorAll('.card-op').forEach((op) => {
            const fasi = op.querySelectorAll('.fase-row');
            const macName = op.querySelector('.op-mac-name').value;

            tableBody.push({ 
                isOpHeader: true, isFirstOfOp: true, isLastOfOp: fasi.length === 0, 
                data: [ 
                    op.querySelector('.op-num').value, 
                    "", 
                    macName, 
                    op.querySelector('.op-tools').value, 
                    "", "", "", "", "" 
                ] 
            });

            fasi.forEach((fase, fIndex) => {
                tableBody.push({ 
                    isOpHeader: false, isFirstOfOp: false, isLastOfOp: (fIndex === fasi.length - 1), 
                    data: [ 
                        "", 
                        `${fase.querySelector('.fase-num').value} - ${fase.querySelector('.fase-desc').value}`, 
                        "", 
                        "", 
                        fase.querySelector('.fase-vt').value, 
                        fase.querySelector('.fase-n').value, 
                        fase.querySelector('.fase-f').value, 
                        fase.querySelector('.fase-p').value, 
                        fase.querySelector('.fase-tc').value 
                    ] 
                });
            });
        });

        doc.autoTable({
            startY: matY + 30,
            head: [['N°', 'DESCRIZIONE OPERAZIONE', 'MACCHINA', 'UTENSILI E\nCALIBRI', 'vc\n[m/min]', 'n\n[rpm]', 'f\n[mm/g]', 'ap\n[mm]', 'tc\n[min]']],
            body: tableBody.map(r => r.data), theme: 'grid',
            didParseCell: function(data) {
                if (data.section === 'body') {
                    const rowData = tableBody[data.row.index];
                    data.cell.styles.lineWidth = { top: rowData.isFirstOfOp ? 0.3 : 0, bottom: rowData.isLastOfOp ? 0.3 : 0, left: 0.1, right: 0.1 };
                    
                    if (rowData.isOpHeader) {
                        data.cell.styles.fillColor = [255, 255, 255]; 
                        data.cell.styles.textColor = [0, 0, 0]; 
                        data.cell.styles.valign = 'top'; 
                        
                        if (data.column.index === 0) data.cell.styles.fontStyle = 'bold';
                        
                        // Spazio riservato al disegno manuale a 60mm
                        if (data.column.index === 1) data.cell.styles.minCellHeight = 60; 
                        
                        if (data.column.index === 2 || data.column.index === 3) {
                            data.cell.styles.valign = 'bottom';
                        }
                    } else {
                        data.cell.styles.valign = 'middle';
                        if (data.column.index === 1) { data.cell.styles.halign = 'left'; data.cell.styles.fontStyle = 'normal'; }
                    }
                }
            },
            columnStyles: { 
                0: { cellWidth: 9, halign: 'center' }, 
                1: { cellWidth: 70 }, 
                2: { cellWidth: 20 }, 
                3: { cellWidth: 24 }, 
                4: { cellWidth: 14, halign: 'center' }, 
                5: { cellWidth: 13, halign: 'center' }, 
                6: { cellWidth: 14, halign: 'center' }, 
                7: { cellWidth: 14, halign: 'center' }, 
                8: { cellWidth: 12, halign: 'center' } 
            },
            styles: { fontSize: 8, textColor: 0, lineColor: 0, overflow: 'linebreak' }, 
            headStyles: { fillColor: 255, textColor: 0, fontStyle: 'bold', lineWidth: 0.3, halign: 'center', valign: 'middle' }, 
            margin: { top: 10, left: 10, right: 10 }
        });
        
        let filePdfName = "Cartellino_Lavorazione.pdf";
        if(getVal('stdName') || getVal('finName')) filePdfName = `${getVal('stdName')}_${getVal('finName')}.pdf`.replace(/\s+/g, "_");
        doc.save(filePdfName);
    }
</script>
